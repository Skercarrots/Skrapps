<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Webapps</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10 font-sans">
  <div class="max-w-4xl mx-auto">
    <header class="mb-10 text-center sm:text-left">
      <h1 class="text-3xl font-bold tracking-tight text-white">Meus Webapps</h1>
      <p class="text-slate-400 mt-1">Ferramentas práticas rodando direto na web</p>
    </header>

    <div id="grid-apps" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
  </div>

  <script>
    // AQUI VOCÊ ADICIONA SEUS APPS:
    const apps = [
      {
        titulo: "Gerador de Senhas",
        desc: "Crie senhas seguras com apenas um clique.",
        icone: "🔐",
        pasta: "senhas/"
      }
    ];

    const grid = document.getElementById("grid-apps");
    apps.forEach(app => {
      const card = document.createElement("a");
      card.href = `./${app.pasta}`;
      card.className = "group block p-5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-indigo-500/50 hover:bg-slate-900/80 transition-all duration-200";
      card.innerHTML = `
        <div class="text-3xl mb-3">${app.icone}</div>
        <h2 class="text-lg font-semibold text-slate-100 group-hover:text-indigo-400 transition-colors">${app.titulo}</h2>
        <p class="text-sm text-slate-400 mt-1 leading-relaxed">${app.desc}</p>
        <span class="inline-flex items-center text-xs font-medium text-indigo-400 mt-4 group-hover:translate-x-1 transition-transform">
          Abrir app &rarr;
        </span>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
