<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skrapps • My Webapps Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative selection:bg-orange-500/20 selection:text-orange-400">

  <!-- Background glow effects -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-tr from-orange-600/15 via-amber-500/10 to-indigo-600/15 blur-[120px] rounded-full"></div>
  </div>

  <main class="max-w-5xl mx-auto px-6 py-12 sm:py-16">
    <!-- Header -->
    <header class="text-center max-w-2xl mx-auto mb-12">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-orange-500/30 bg-orange-500/10 text-orange-400 text-xs font-semibold uppercase tracking-wider mb-4">
        <span>🥕</span> by skercarrots
      </div>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-3">
        Skrapps<span class="text-orange-500">.</span>
      </h1>
      <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
        A personal collection of drawing utilities, game dev experiments, handy mini-tools, and fun playful webapps.
      </p>

      <!-- Search bar -->
      <div class="mt-8 relative max-w-md mx-auto">
        <input 
          type="text" 
          id="search-bar" 
          placeholder="Filter tools..." 
          class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 pl-11 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500/60 focus:ring-2 focus:ring-orange-500/20 transition backdrop-blur-md"
        >
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔍</span>
      </div>
    </header>

    <!-- Apps Grid -->
    <div id="grid-apps" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <!-- Empty State -->
    <div id="no-results" class="hidden text-center py-16 text-slate-500 text-sm">
      No apps match your search.
    </div>

    <!-- Footer -->
    <footer class="mt-20 pt-8 border-t border-slate-900 text-center text-xs text-slate-500">
      <p>Skrapps • Designed & curated by <span class="text-slate-400 font-medium">skercarrots</span></p>
    </footer>
  </main>

  <script>
    // ==========================================
    // ADD OR EDIT YOUR WEBPAGES HERE:
    // ==========================================
    const apps = [
      {
        title: "Squeeeeze",
        desc: "High-efficiency lossless perceptual image compressor",
        // Custom badge HTML matching the Squeeeeze branding:
        badgeHtml: `
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-950 via-purple-900/60 to-slate-900 border border-indigo-500/40 flex items-center justify-center select-none group-hover:scale-110 transition-transform shadow-md shadow-indigo-950/60">
            <span class="text-2xl font-serif italic font-bold text-indigo-100 tracking-tighter">e</span>
            <sup class="text-xs font-mono font-bold text-cyan-400 ml-0.5 -mt-2">-4</sup>
          </div>
        `,
        tag: "Utility",
        path: "squeeeeze/"
      },
      {
        title: "Lunar SLAM & Path Lab",
        desc: "Real-time benchmark of frontier exploration (BCFE, NBV, Yamauchi) with strict energy-budget safety constraints.",
        badgeHtml: `
          <div class="w-12 h-12 rounded-xl bg-cyan-950/80 border border-cyan-500/50 flex items-center justify-center select-none group-hover:scale-110 transition-transform shadow-md shadow-cyan-950/60">
            <svg class="w-6 h-6 text-cyan-400 group-hover:rotate-45 transition-transform duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a10 10 0 0 1 10 10"></path>
            </svg>
          </div>
        `,
        tag: "Simulator",
        path: "lunar-rover/"
      },
      {
        title: "Instagram Carousel Splitter",
        desc: "Interactive zero-seam portrait panorama generator calibrated for 1080×1350 multi-slide carousels (1×2 & 1×3).",
        badgeHtml: `
          <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500/20 via-rose-500/20 to-purple-600/30 border border-rose-500/40 flex items-center justify-center select-none group-hover:scale-110 transition-transform shadow-md shadow-purple-950/50">
            <svg class="w-6 h-6 text-rose-400 group-hover:text-rose-300 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21" stroke-dasharray="2 2"></line>
              <line x1="15" y1="3" x2="15" y2="21" stroke-dasharray="2 2"></line>
            </svg>
          </div>
        `,
        tag: "Utility",
        path: "instagram-carousel-splitter/"
      },
      {
        title: "Line Art Extractor",
        desc: "Digitize paper sketches into transparent, ready-to-color digital line art with real-time threshold controls.",
        badgeHtml: `
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-950 via-amber-900/60 to-slate-900 border border-amber-500/40 flex items-center justify-center select-none group-hover:scale-110 transition-transform shadow-md shadow-amber-950/60">
            <svg class="w-6 h-6 text-amber-400 group-hover:text-amber-300 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
          </div>
        `,
        tag: "Creative Tool",
        path: "line-art-extractor/"
      }
    ];

    const grid = document.getElementById("grid-apps");
    const noResults = document.getElementById("no-results");
    const searchInput = document.getElementById("search-bar");

    function renderApps(filter = "") {
      grid.innerHTML = "";
      const query = filter.toLowerCase().trim();
      const filtered = apps.filter(app => 
        app.title.toLowerCase().includes(query) || 
        app.desc.toLowerCase().includes(query) ||
        (app.tag && app.tag.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      filtered.forEach(app => {
        const card = document.createElement("a");
        card.href = `./${app.path}`;
        card.className = "group relative p-6 rounded-2xl bg-slate-900/50 border border-slate-800/80 hover:border-orange-500/40 hover:bg-slate-900/80 transition-all duration-300 backdrop-blur-sm flex flex-col justify-between hover:-translate-y-1 hover:shadow-xl hover:shadow-orange-500/5";

        // Logic to choose between custom badge HTML or standard emoji box
        const iconElement = app.badgeHtml ? app.badgeHtml : `
          <div class="w-12 h-12 rounded-xl bg-slate-800/70 border border-slate-700/50 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            ${app.icon || "📦"}
          </div>
        `;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              ${iconElement}
              ${app.tag ? `<span class="text-[11px] font-medium text-orange-400/90 bg-orange-500/10 border border-orange-500/20 px-2.5 py-0.5 rounded-full">${app.tag}</span>` : ""}
            </div>
            <h2 class="text-base font-semibold text-slate-100 group-hover:text-orange-400 transition-colors">
              ${app.title}
            </h2>
            <p class="text-xs text-slate-400 mt-2 leading-relaxed">
              ${app.desc}
            </p>
          </div>
          <div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs font-medium text-slate-400 group-hover:text-orange-400 transition-colors">
            <span>Launch app</span>
            <span class="transform group-hover:translate-x-1 transition-transform">&rarr;</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", (e) => {
      renderApps(e.target.value);
    });

    renderApps();
  </script>
</body>
</html>
