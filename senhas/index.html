<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 p-6 rounded-2xl max-w-sm w-full shadow-lg border border-slate-700 text-center">
    <h1 class="text-xl font-bold mb-4">Gerador de Senhas 🔐</h1>
    <input type="text" id="senha" readonly class="w-full bg-slate-950 text-green-400 font-mono text-center p-3 rounded-xl border border-slate-700 mb-4 focus:outline-none" placeholder="Clique abaixo">
    <div class="flex gap-2">
      <button onclick="gerar()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl font-medium transition">Gerar</button>
      <button onclick="copiar()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-xl text-sm transition">Copiar</button>
    </div>
    <a href="../" class="inline-block mt-5 text-xs text-slate-400 hover:underline">&larr; Voltar para a central</a>
  </div>

  <script>
    function gerar() {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
      let res = "";
      for (let i = 0; i < 14; i++) res += chars[Math.floor(Math.random() * chars.length)];
      document.getElementById("senha").value = res;
    }
    function copiar() {
      const input = document.getElementById("senha");
      if (!input.value) return;
      navigator.clipboard.writeText(input.value);
      alert("Senha copiada!");
    }
    gerar();
  </script>
</body>
</html>
